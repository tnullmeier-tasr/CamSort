name: Build CamSort
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: SRT-Test
        continue-on-error: true
        run: |
          mkdir t && cp Sources/SRTSpeed.swift t/ && cp Tests/srt_test.swift t/main.swift
          swiftc t/*.swift -o srttest 2> err.txt || { echo "::error::$(head -c 800 err.txt | tr '\n' ' ')"; exit 1; }
          echo "::notice::SRT-Test: $(./srttest Tests/DJI_0162.SRT | tr '\n' ' ')"
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: CamSort
          path: build/CamSort.zip
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" build/CamSort.zip \
            --title "CamSort 1.0 (Build ${{ github.run_number }})" \
            --notes "CamSort.zip herunterladen, entpacken, CamSort in den Programme-Ordner ziehen."
