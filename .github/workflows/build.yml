name: Build CamSort
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  workflow_dispatch:
permissions:
  contents: write

# Sparsam: ein neuer Push bricht einen laufenden Build ab.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: SRT-Test
        continue-on-error: true
        run: |
          mkdir t && cp Sources/SRTSpeed.swift t/ && cp Tests/srt_test.swift t/main.swift
          swiftc t/*.swift -o srttest 2> err.txt || { echo "::error::$(head -c 800 err.txt | tr '\n' ' ')"; exit 1; }
          echo "::notice::SRT-Test: $(./srttest Tests/DJI_0162.SRT | tr '\n' ' ')"
      - name: Gyroflow-CLI-Test
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test]')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download -R gyroflow/gyroflow -p '*mac*.dmg' -O gf.dmg || { echo "::warning::Gyroflow-Download fehlgeschlagen"; exit 0; }
          hdiutil attach gf.dmg -nobrowse -mountpoint /tmp/gf >/dev/null
          APP=$(ls -d /tmp/gf/*.app | head -1)
          EXE=$(ls "$APP/Contents/MacOS/" | head -5 | tr '\n' ' ')
          echo "::notice::Gyroflow-App: $APP – Programme: $EXE"
          BIN="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS/" | grep -i gyroflow | head -1)"
          H=$("$BIN" --help < /dev/null 2>&1 | grep -E -- '--preset|-t,|--stdout-progress|-f,|--overwrite' | tr '\n' '|' | head -c 900)
          echo "::notice::CLI-Optionen: $H"
          # Rendertest mit synthetischem Clip ohne Gyro-Daten: Erwartet sauberes Ende ohne Hängen
          ffmpeg -loglevel error -f lavfi -i testsrc=size=640x360:rate=25 -t 2 -pix_fmt yuv420p test.mp4 2>/dev/null || true
          if [ -f test.mp4 ]; then
            timeout 120 "$BIN" "$PWD/test.mp4" -t _stabilized -f --stdout-progress < /dev/null > out.txt 2>&1; RC=$?
            echo "::notice::Rendertest Exitcode $RC, Ausgabe: $(tail -c 600 out.txt | tr '\n' ' ')"
            ls test_stabilized* 2>/dev/null && echo "::notice::Ausgabedatei erzeugt"
          fi
      - name: Screenshot
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test]')
        continue-on-error: true
        run: |
          swiftc -D SCREENSHOT -parse-as-library Sources/*.swift Tests/Screenshot.swift -o shot 2> err.txt || { echo "::error::$(head -c 900 err.txt | tr '\n' ' ')"; exit 1; }
          mkdir -p docs && ./shot docs/screenshot-fertig.png
          git config user.name "CamSort CI"; git config user.email "ci@users.noreply.github.com"
          git add docs/screenshot-fertig.png && git commit -m "Screenshot aktualisiert [skip ci]" && git push || true
      - name: Cloud-Test (E2E)
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test]')
        continue-on-error: true
        run: |
          which ffmpeg || brew install ffmpeg >/dev/null 2>&1
          ./Tests/make_fixtures.sh "$RUNNER_TEMP/Testordner" > fixtures.txt 2>&1 || true
          echo "::notice::Testdaten: $(tail -c 1200 fixtures.txt | tr '\n' ' ')"
          swiftc -D SCREENSHOT -D E2E -parse-as-library Sources/*.swift Tests/E2E.swift -o e2e 2> err.txt || { echo "::error::$(head -c 1500 err.txt | tr '\n' ' ')"; exit 1; }
          mkdir -p docs/test
          ./e2e "$RUNNER_TEMP/Testordner" docs/test > e2e.txt 2>&1; echo "::notice::E2E Exit $?"
          (cd "$RUNNER_TEMP/Testordner" && find . -not -name '.*' | sort) > docs/test/ordnerstruktur.txt
          cp fixtures.txt docs/test/testdaten.txt
          cp e2e.txt docs/test/ausgabe.txt
          git config user.name "CamSort CI"; git config user.email "ci@users.noreply.github.com"
          git pull -q --rebase || true
          git add docs/test && git commit -qm "Testergebnis [skip ci]" && git push -q || true
      - name: Build
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: ./build.sh
      - name: Echtes Bildschirmfoto
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[test]')
        continue-on-error: true
        run: |
          open build/CamSort.app; sleep 8
          mkdir -p docs/test
          screencapture -x -o -l$(osascript -e 'tell application "System Events" to get id of first window of process "CamSort"' 2>/dev/null || echo 0) docs/test/echt-start.png 2>/dev/null || screencapture -x docs/test/echt-start.png
          osascript -e 'quit app "CamSort"' || true
          git config user.name "CamSort CI"; git config user.email "ci@users.noreply.github.com"
          git pull -q --rebase || true
          git add docs/test && git commit -qm "Bildschirmfoto [skip ci]" && git push -q || true
      - uses: actions/upload-artifact@v4
        with:
          name: CamSort
          path: build/CamSort.zip
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" build/CamSort.zip \
            --title "CamSort 1.0 (Build ${{ github.run_number }})" \
            --notes "CamSort.zip herunterladen, entpacken, CamSort in den Programme-Ordner ziehen."
